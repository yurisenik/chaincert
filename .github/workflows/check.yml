name: Check
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.4'
          cache: false
      - run: go vet ./...
      - run: go test -race ./...
      - run: docker build -t chaincert:test .
      - name: Check image
        run: |
          docker run -d --name probe -p 127.0.0.1:8080:8080 chaincert:test
          curl --retry 10 --retry-connrefused --retry-delay 1 -fsS http://127.0.0.1:8080/healthz
